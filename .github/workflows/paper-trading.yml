name: Paper trading

# Replaces the Windows Task Scheduler tasks. Same scripts, same trading logic.
# Times are UTC (GitHub cron). The scripts check New York time themselves, so these only need to
# land in the right window in both US daylight-saving regimes, with room for GitHub's start delays:
#   12:05 UTC  morning  = 07:05 (winter) / 08:05 (summer) New York; orders refused at/after 09:28 NY
#   19:20 UTC  close    = 14:20 / 15:20 New York; Setup E waits until 15:35 NY (refuses after 15:48)
#   22:15 UTC  evening  = 17:15 / 18:15 New York, after the daily bars are final
#   05:30 UTC  data     = daily data refresh and research backfill
# Weekdays only; the scripts also skip market holidays using the trading calendar.
on:
  schedule:
    - cron: "5 12 * * 1-5"
    - cron: "20 19 * * 1-5"
    - cron: "15 22 * * 1-5"
    - cron: "30 5 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [morning, close, evening, data]
        required: true
      send:
        description: Send paper orders (untick for a dry run)
        type: boolean
        default: false
      force_time:
        description: Dry runs only - skip the time-of-day checks (for testing)
        type: boolean
        default: false

# Secrets are only used by scheduled and manual runs; this workflow never runs on pull requests.
permissions:
  contents: write  # to push the journal/plans/reports to the bot-state branch

concurrency:
  group: bot-state  # one run at a time: they all read and write the same state
  cancel-in-progress: false

env:
  STATE_BRANCH: bot-state
  STATE_PATHS: journal plans reports logs/orders.jsonl
  CACHE_PATHS: |
    data/prices
    data/prices_yahoo
    data/calendar
    data/universe
    data/earnings
    data/rates
    data/raw/yahoo
    data/raw/finnhub
    data/raw/alphavantage
    data/consensus_log

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Setup E's close job can wait up to ~75 minutes for 15:35 NY
    env:
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
      ALPACA_E_KEY_ID: ${{ secrets.ALPACA_E_KEY_ID }}
      ALPACA_E_SECRET_KEY: ${{ secrets.ALPACA_E_SECRET_KEY }}
      ALPACA_E_BASE_URL: ${{ secrets.ALPACA_E_BASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Work out which job this is
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            job="${{ inputs.job }}"; send="${{ inputs.send }}"; force="${{ inputs.force_time }}"
          else
            case "${{ github.event.schedule }}" in
              "5 12 * * 1-5")  job=morning ;;
              "20 19 * * 1-5") job=close ;;
              "15 22 * * 1-5") job=evening ;;
              "30 5 * * 1-5")  job=data ;;
              *) echo "unknown schedule"; exit 1 ;;
            esac
            send=true; force=false
          fi
          flag=""; [ "$send" = "true" ] && flag="--send"
          [ "$send" != "true" ] && [ "$force" = "true" ] && flag="--force-time"
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          echo "Job: $job  flags: ${flag:-'(dry run)'}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Fetch saved state (bot-state branch)
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$STATE_BRANCH"
            git worktree add _state FETCH_HEAD
            for p in $STATE_PATHS; do
              if [ -e "_state/$p" ]; then mkdir -p "$(dirname "$p")"; cp -r "_state/$p" "$(dirname "$p")/"; fi
            done
          else
            echo "No $STATE_BRANCH branch yet: starting with empty state."
          fi

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: bot-data-${{ github.run_id }}
          restore-keys: bot-data-

      - name: Run
        id: run
        run: |
          set +e
          rc=0
          case "${{ steps.pick.outputs.job }}" in
            morning)
              python scripts/submit_orders.py ${{ steps.pick.outputs.flag }} || rc=1
              python scripts/e_live.py morning ${{ steps.pick.outputs.flag }} || rc=1 ;;
            close)
              python scripts/e_live.py close ${{ steps.pick.outputs.flag }} || rc=1 ;;
            evening)
              python scripts/evening.py ${{ steps.pick.outputs.flag }} || rc=1
              python scripts/e_live.py evening ${{ steps.pick.outputs.flag }} || rc=1 ;;
            data)
              python scripts/update_data.py --yahoo-backfill --earnings-backfill || rc=1 ;;
          esac
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Save state to the bot-state branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d _state ]; then
            git worktree add --orphan -b "$STATE_BRANCH" _state
          fi
          for p in $STATE_PATHS; do
            if [ -e "$p" ]; then mkdir -p "_state/$(dirname "$p")"; cp -r "$p" "_state/$(dirname "$p")/"; fi
          done
          cd _state
          git add -A
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -q -m "state: ${{ steps.pick.outputs.job }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin "HEAD:$STATE_BRANCH"

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATHS }}
          key: bot-data-${{ github.run_id }}

      - name: Back up the pre-report consensus log (private artifact, not published)
        if: always() && steps.pick.outputs.job == 'evening'
        uses: actions/upload-artifact@v4
        with:
          name: consensus-log-${{ github.run_id }}
          path: data/consensus_log
          retention-days: 90
          if-no-files-found: ignore

      - name: Fail the run if a script failed
        if: steps.run.outputs.rc != '0'
        run: |
          echo "A script exited with an error; see the Run step above."
          exit 1
